#version: "3.8"

services:
  # --- INIT CONTAINER: Descarga JDKs dinámicamente ---
  jdk-downloader:
    build:
      context: ./jdk-manager
      dockerfile: Dockerfile
    container_name: mesh-jdk-downloader
    environment:
      # SIMPLICIDAD: El usuario solo pone los números aquí separados por comas
      - JDK_VERSIONS=8
    volumes:
      # Mapeamos una carpeta de tu PC al volumen del contenedor
      - ./jdks_data:/opt/jdks

  # --- 1. FRONTEND (Nginx Reverse Proxy) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mesh-frontend
    ports:
      - "80:80"
    depends_on:
      - github-api
      - sonar-api
    networks:
      - mesh-network

  # --- 2. GITHUB API (Clonador) ---
  github-api:
    build:
      context: ./github-api
      dockerfile: Dockerfile
    container_name: mesh-github-api
    environment:
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - CLONES_DIR=/app/clones
    volumes:
      - ./data_clones:/app/clones
    networks:
      - mesh-network

  # --- 3. SONAR API (Analizador) ---
  sonar-api:
    build:
      context: ./sonar_go
      dockerfile: Dockerfile
    container_name: mesh-sonar-api
    depends_on:
      jdk-downloader:
        condition: service_completed_successfully
    environment:
      - PORT=3001
      - SONAR_TOKEN=${SONAR_TOKEN}
      - CLONES_PATH=/app/clones
    volumes:
      - ./data_clones:/app/clones
      - ./jdks_data:/opt/jdks
      - sonar_db_data:/app/data
      - g_versions_cache:/root/.g
      - maven_data:/root/.m2
    networks:
      - mesh-network

volumes:
  sonar_db_data:
  g_versions_cache:
  maven_data:

networks:
  mesh-network:
    driver: bridge
